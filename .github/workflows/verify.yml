name: Verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: privacy_messenger_test
          POSTGRES_USER: messenger_test
          POSTGRES_PASSWORD: messenger_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U messenger_test -d privacy_messenger_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://messenger_test:messenger_test@127.0.0.1:5432/privacy_messenger_test
      TEST_DATABASE_URL: postgresql://messenger_test:messenger_test@127.0.0.1:5432/privacy_messenger_test
      APP_ORIGIN: http://127.0.0.1:3000
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run db:migrate
      - run: npm run test:unit
      - run: npm run test:integration
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:e2e
      - run: npm run build
