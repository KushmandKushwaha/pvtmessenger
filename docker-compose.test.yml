services:
  postgres-test:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: privacy_messenger_test
      POSTGRES_USER: messenger_test
      POSTGRES_PASSWORD: messenger_test
    ports:
      - '55432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U messenger_test -d privacy_messenger_test']
      interval: 2s
      timeout: 3s
      retries: 20
    tmpfs:
      - /var/lib/postgresql/data
