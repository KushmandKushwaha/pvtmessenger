services:
  - type: web
    name: privacy-messenger-realtime
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm run realtime
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: APP_ORIGIN
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: REALTIME_TICKET_SECRET
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: "false"
      - key: WEB_PUSH_SUBJECT
        sync: false
      - key: WEB_PUSH_VAPID_PUBLIC_KEY
        sync: false
      - key: WEB_PUSH_VAPID_PRIVATE_KEY
        sync: false
      - key: LOG_LEVEL
        value: info
      - key: TRUST_PROXY
        value: "false"
